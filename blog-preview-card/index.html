<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="public/images/favicon-32x32.png">

  <title>Frontend Mentor | Blog preview card</title>

  <!-- Google Fonts: Figtree (Weights 500, 800) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,500;0,800;1,500;1,800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="/src/style.css" type="text/css">

  <style>
    .attribution {
      font-size: 0.6875rem;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>
</head>

<body>
  <main class="flex justify-center h-screen items-center">
    <article class="bg-white w-[384px] h-130.5 p-6 rounded-2xl shadow-card hover:shadow-card-hover border">
      <img src="/images/illustration-article.svg" class="rounded-lg mb-6" />
      <span class="bg-yellow px-3 py-1 rounded text-sm font-semibold">Learning</span>
      <p class="py-4 text-sm text-gray-950 font-normal">Published 21 Dec 2023</p>
      <h1 class="font-bold text-2xl">HTML & CSS foundations</h1>
      <p class="text-gray-500 py-4 font-normal">These languages are the backbone of every website,
        defining structure, content, and presentation.
      </p>
      <div class="inline-flex items-center gap-3">
        <img src="/images/image-avatar.webp" class="h-8" />
        <span class="text-sm font-bold">Greg Hooper</span>
      </div>
    </article>
  </main>


  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>

</html>
