<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Preview Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Montserrat:wght@500;700&display=swap"
    rel="stylesheet">
  <link href="/src/style.css" rel="stylesheet">
</head>

<body class="bg-cream text-grey font-montserrat min-h-screen flex flex-col items-center justify-center p-4">
  <main class="w-full max-w-[343px] md:max-w-[600px] my-6">

    <article class="bg-white rounded-xl overflow-hidden shadow-sm flex flex-col md:flex-row">
      <div class="md:w-1/2">
        <picture class="block h-full">
          <source media="(min-width: 768px)" srcset="/image-product-desktop.jpg" />
          <img src="/image-product-mobile.jpg" alt="Gabrielle Essence Eau De Parfum bottle laying among foliage"
            class="w-full h-full object-cover" />
        </picture>
      </div>

      <div class="p-6 md:p-8 md:w-1/2 flex flex-col justify-between">
        <div>
          <p class="text-xs uppercase tracking-[5px] text-grey mb-3 md:mb-4">Perfume</p>
          <h1 class="font-fraunces text-3xl font-bold text-very-dark-blue leading-tight mb-4 md:mb-6">
            Gabrielle Essence Eau De Parfum
          </h1>
          <p class="text-sm leading-relaxed text-grey">
            A floral, solar and voluptuous interpretation composed by Olivier Polge,
            Perfumer-Creator for the House of CHANEL.
          </p>
        </div>

        <div>
          <div class="flex items-center gap-5 my-5 md:my-6">
            <span class="sr-only">Current price:</span>
            <span class="font-fraunces text-3xl font-bold text-green-500">$149.99</span>
            <span class="sr-only">Original price:</span>
            <span class="text-sm line-through text-grey">$169.99</span>
          </div>

          <button
            class="w-full bg-green-500 hover:bg-green-700 active:bg-green-700 text-white font-bold py-3.5 px-4 rounded-lg flex items-center justify-center gap-3 transition-colors duration-200 cursor-pointer focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-green-700">
            <img src="/icon-cart.svg" alt="" aria-hidden="true" class="w-4 h-4" />
            <span>Add to Cart</span>
          </button>
        </div>
      </div>
    </article>

  </main>
  <footer class="text-xs text-center text-grey mt-2">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" class="underline hover:text-green-700"
      target="_blank" rel="noopener noreferrer">Frontend Mentor</a>.
    Coded by <a href="#" class="underline hover:text-green-700">Austin Akers</a>.
  </footer>
</body>

</html>
